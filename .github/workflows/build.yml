name: Build G醫t client (unsigned)

# Manual only. All jobs passed on GitHub's runners on 2026-10-16 (built files not installed or run there). Signing certificates / keystores are not set up.
on:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: . }
      - run: cargo test -p git_core

  desktop:
    needs: core-tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: . }
      - run: npm install
      - run: npx tauri build
      # tauri-action's own artifact upload put nothing into the run, so the bundles are uploaded here (unsigned).
      - uses: actions/upload-artifact@v4
        with:
          name: g-i-t-client-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz

  # Linux: the Debian package of Tauri (amd64). The deb of `debian/` (own apt repository) is built by hand, see AGENTS.md section 1a.
  linux-deb:
    needs: core-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: . }
      - run: npm install
      - run: npx tauri build --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: g-i-t-client-deb
          path: target/release/bundle/deb/*.deb

  # Android builds on Linux (cheapest minutes). `src-tauri/gen/android` is COMMITTED (it holds our Kotlin job and bridge), so
  # `tauri android init` must NOT run here: it would overwrite them. All four ABIs, x86_64 included (ChromeOS).
  android:
    needs: core-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: . }
      - run: npm install
      - name: Build the APK (all four ABIs)
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --apk
      - name: Check the four ABIs
        run: |
          apk=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk)
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do unzip -l "$apk" | grep -q "lib/$abi/libgit_client_lib.so" || { echo "missing $abi"; exit 1; }; done
      - uses: actions/upload-artifact@v4
        with:
          name: g-i-t-client-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  # iOS / iPadOS: macOS runner only. A simulator build needs no signing; a device build needs an Apple Developer account.
  # What is built here can be started in a simulator (`xcrun simctl`), but a CI runner has no screen to watch.
  ios-simulator:
    needs: core-tests
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios-sim }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: . }
      - run: npm install
      - run: npx tauri ios init # gen/apple is not committed yet
      - run: npx tauri ios build --debug --target aarch64-sim
