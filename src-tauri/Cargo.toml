[package]
name = "git-client"
version = "0.1.0"
description = "G醫t client: notifications for the sites you follow"
license = "MPL-2.0"
edition = "2021"

[lib]
name = "git_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# A build for a store (Mac App Store, App Store, Google Play, Microsoft Store): hides the Stripe button and the license-key field.
store-build = []

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git_core = { path = "../core" }

# desktop only: these plugins do not exist on Android / iOS
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

# Android only: the entry points that the background job (WorkManager, Kotlin) calls
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
